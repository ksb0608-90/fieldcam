name: APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 만들기
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk FieldCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FieldCam-APK
          path: FieldCam.apk

      - name: 릴리스(다운로드 링크) 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: 현장카메라 v1.1.${{ github.run_number }}
          files: FieldCam.apk
          make_latest: true
